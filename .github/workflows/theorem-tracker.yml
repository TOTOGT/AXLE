name: Theorem Tracker

# Scans the repo's top-level .lean files after every push that touches
# a .lean file (or the tracker script itself), and commits an updated
# shields.io "endpoint" badge JSON to badges/theorem-status.json.
#
# This does NOT run Lean/Lake — it's a fast, no-toolchain text scan
# (see scripts/theorem_tracker.py for the documented heuristic and its
# one known caveat). It is a separate, lightweight signal from any
# real kernel-verification build CI; the two are complementary, not a
# replacement for each other.
#
# README badge markdown, once this has run at least once on `main`:
#   ![theorems](https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/TOTOGT/AXLE/main/badges/theorem-status.json)

on:
  push:
    branches: [main]
    paths:
      - "**/*.lean"
      - "scripts/theorem_tracker.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run theorem tracker
        run: python3 scripts/theorem_tracker.py --root . --write badges/theorem-status.json

      - name: Commit badge data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update theorem-tracker badge data [skip ci]"
          file_pattern: badges/theorem-status.json
