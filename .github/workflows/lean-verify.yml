name: lean kernel check

# Drop into the Lean repo (AXLE / geometry / orthogenesis) as
# .github/workflows/lean-verify.yml
#
# This is the step that earns the word "verified". Nothing in the corpus may
# be described as kernel-verified until this job is green, and the job prints
# the axiom list so the claim is checkable from the log rather than trusted.

on:
  push:
    paths: ["**/*.lean", "lakefile.*", "lean-toolchain"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"          # weekly: catches Mathlib drift breaking old proofs

permissions:
  contents: read
  issues: write

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib build
        uses: actions/cache@v4
        with:
          path: |
            .lake
            ~/.elan
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: lake-${{ runner.os }}-

      - name: Fetch prebuilt Mathlib
        run: lake exe cache get || echo "no cache available; will build"

      - name: Build
        run: lake build

      # ------------------------------------------------------------------
      # The axiom audit. A file that compiles can still rest on `sorryAx`.
      # This is the check that distinguishes "it compiled" from "it is proved".
      # ------------------------------------------------------------------
      - name: Axiom audit
        id: axioms
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'EOF'
          import DPSEstimator
          #print axioms DPS.transfer_nonneg
          #print axioms DPS.transfer_mono
          #print axioms DPS.transfer_headline_conservative
          #print axioms DPS.headline_mem_unit_interval
          #print axioms DPS.incremental_nonneg
          #print axioms DPS.published_le_naive
          EOF
          lake env lean /tmp/Audit.lean | tee /tmp/axioms.txt

          echo "### Axiom audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/axioms.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if grep -q "sorryAx" /tmp/axioms.txt; then
            echo "::error::sorryAx present — these theorems are NOT proved."
            exit 1
          fi
          echo "clean=true" >> "$GITHUB_OUTPUT"

      - name: Reject stray sorries in the file
        run: |
          if grep -rn --include=DPSEstimator.lean -E '(^|[^-])\bsorry\b' . ; then
            echo "::error::literal sorry found in DPSEstimator.lean"
            exit 1
          fi
          echo "no sorry in source"

      - name: Verification receipt
        if: steps.axioms.outputs.clean == 'true'
        run: |
          {
            echo "# Verification receipt"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- date: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            cat /tmp/axioms.txt
            echo '```'
            echo ""
            echo "Axioms are [propext, Classical.choice, Quot.sound] with no sorryAx."
            echo "WP-36 may cite DPSEstimator.lean as kernel-verified as of this commit."
          } > VERIFICATION.md
          cat VERIFICATION.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-check-${{ github.run_number }}
          path: |
            /tmp/axioms.txt
            VERIFICATION.md
          retention-days: 90

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Lean kernel check failing"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || echo "")
          BODY="Kernel check failed on \`${{ github.sha }}\`.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **Until this is green, no document may describe the affected theorems as verified.**
          If Mathlib drift broke a previously-green proof, fix the proof — do not
          weaken the statement, and do not remove the UNVERIFIED tag from any paper
          that cites it."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label lean
          fi
