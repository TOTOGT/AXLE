name: Verify Lean proofs (real kernel check)

# Same honest approach as TOTOGT/GTCT's verify-proofs.yml, adapted for AXLE's
# messier layout: this repo has ~20+ loose root-level .lean files, many of
# them superseded version history (Main_v2.lean..Main_v5.lean, AXLE_v5_1.lean,
# AXLE_v6.lean, AXLE_V8.lean, AXLE_V8.1.lean, AXLE_v8.1.lean, ...) that are
# very likely never actually imported by anything. Rather than walking the
# whole folder and risking false "theorems" from dead files, this workflow:
#
#   1. Installs the pinned Lean toolchain and runs `lake build` on the real
#      default target (AXLE) plus every named toy library in lakefile.toml.
#   2. Reads back the REAL compiled module list from the .olean files Lake
#      actually produced under .lake/build/lib/ -- ground truth, not a guess.
#   3. Maps each compiled module to its source file and extracts theorem/
#      lemma declarations ONLY from files that were genuinely part of the
#      build (extract_names_from_modules.py).
#   4. Runs the real `#print axioms <name>` command through the Lean kernel
#      on every one of those, and parses proved / sorry / extra-axiom /
#      unresolved from the real output.
#   5. Writes a dynamic shields.io badge JSON from that real result and
#      commits it back to the repo.
#
# NOTE (fixed, this pass): the build target list below previously included
# PoincareToy, whose source file (Dm3PoincareToy.lean) does not exist
# anywhere in this repo -- removed. Main (Main_v6.lean) is newly added:
# it was never wired into any lakefile target before, so the README's
# "0 axioms beyond Mathlib4 . 9 honest sorrys" claim about that file was
# never actually checked by anything. It now is.

on:
  push:
    branches: [main]
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - '.github/workflows/verify-proofs.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean version manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-axle-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}

      - name: lake build (the real check — fails the job if anything doesn't compile)
        run: |
          lake update
          lake build AXLE Kakeya GoldbachToy NSToy RHToy MahloHierarchy Main PrincipiaVol1

      - name: Determine which modules actually compiled (real build output, not a folder guess)
        run: |
          find .lake/build/lib -name "*.olean" \
            | sed 's#^\.lake/build/lib/##; s#\.olean$##' \
            | sort -u > /tmp/compiled_modules.txt
          wc -l /tmp/compiled_modules.txt
          cat /tmp/compiled_modules.txt

      - name: Map compiled modules to source files and extract real theorem/lemma names
        run: |
          python3 scripts/extract_names_from_modules.py /tmp/compiled_modules.txt . > /tmp/all_names.txt
          wc -l /tmp/all_names.txt
          cat /tmp/all_names.txt

      - name: Generate #print axioms probe file
        run: |
          python3 scripts/make_axiom_probe_modules.py /tmp/all_names.txt > CheckAllAxioms.lean

      - name: Run real axiom check through the Lean kernel
        run: |
          lake env lean CheckAllAxioms.lean > /tmp/axiom_output.txt 2>&1 || true
          tail -80 /tmp/axiom_output.txt

      - name: Parse real output into registry.csv
        run: |
          python3 scripts/parse_axiom_output.py /tmp/axiom_output.txt /tmp/all_names.txt > registry.csv
          echo "=== Summary ==="
          python3 -c "
          import csv
          from collections import Counter
          with open('registry.csv') as f:
              rows = list(csv.DictReader(f))
          print(Counter(r['status'] for r in rows))
          print(f'total: {len(rows)}')
          "

      - name: Upload real registry as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: theorem-registry-real
          path: registry.csv

      - name: Generate dynamic badge JSON from the real result
        run: |
          python3 - <<'PYEOF'
          import csv, json, os

          with open('registry.csv') as f:
              rows = list(csv.DictReader(f))

          proved = sum(1 for r in rows if r['status'] == 'proved')
          sorry_n = sum(1 for r in rows if r['status'] == 'sorry')
          extra = sum(1 for r in rows if r['status'] == 'extra-axiom')
          unresolved = sum(1 for r in rows if r['status'] == 'unresolved')
          total = len(rows)

          if sorry_n:
              color = 'red'
          elif unresolved:
              color = 'orange'
          elif extra:
              color = 'yellow'
          else:
              color = 'brightgreen'

          message = f'{proved}/{total} proved'
          if sorry_n:
              message += f' · {sorry_n} sorry'
          if extra:
              message += f' · {extra} axiom'
          if unresolved:
              message += f' · {unresolved} unresolved'

          data = {
              'schemaVersion': 1,
              'label': 'Lean kernel check',
              'message': message,
              'color': color,
          }

          os.makedirs('.github/badges', exist_ok=True)
          with open('.github/badges/axle-status.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')

          print(json.dumps(data, indent=2))
          PYEOF

      - name: Commit badge data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/axle-status.json
          if git diff --cached --quiet; then
            echo "Badge unchanged, nothing to commit."
          else
            git commit -m "chore: update real kernel-verified proof badge (automated)"
            git push
          fi
