# AXLE lakefile.toml
# G6 LLC · Pablo Nogueira Grossi · Newark NJ · 2026
#
# Changes from previous version:
#   · Mathlib rev pinned to a stable commit (update deliberately, not on every lake update)
#   · [[lean_lib]] given explicit roots = ["AXLE"] so Lake finds AXLE.lean as the entry point
#   · Collatz toy and NS toy added as separate executables for standalone testing
#
# To update Mathlib: change the rev below to the desired commit hash, then run:
#   lake update
#   lake build
#
# Current Mathlib pin: v4.14.0 release commit
# Update this intentionally, not automatically.
#
# NOTE (fixed, two real bugs found via the first real `lake build` this repo
# has ever had run against it):
#   1. This file previously used `--` (Lean-style) comments, which is not
#      valid TOML syntax (TOML comments use `#`) -- `lake build` failed to
#      even parse the file (`lakefile.toml:1:3: error: unexpected 'A';
#      expected '='`).
#   2. The [[require]] block used `from = "git"` / `url = "..."`, which are
#      not real Lake TOML fields -- the correct field is `git = "<url>"`
#      (verified against a real, working lakefile.toml). Lake's actual error
#      was: "ill-formed dependency: dependency is missing a source and is
#      missing a scope for Reservoir".
# Both fixed here; no other content changed.
#
# NOTE (fixed, this pass -- three more real bugs found by continuing the
# first real `lake build`):
#   3. roots = ["Finite"] did not match the real file, which is lowercase
#      finite.lean. Case-sensitive on Linux CI runners; invisible on
#      case-insensitive macOS filesystems, so this went undetected until now.
#   4. The PoincareToy target (roots = ["Dm3PoincareToy"]) pointed at a file
#      that does not exist anywhere in this repository. Removed.
#   5. Main_v6.lean (the file the README's "0 axioms beyond Mathlib4 . 9
#      honest sorrys" claim is actually about) was never wired into any
#      lakefile target, so it was never compiled or checked by anything.
#      Added as its own target so CI can genuinely verify that claim.

name = "AXLE"
version = "0.1.0"
defaultTargets = ["AXLE"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.14.0"

# ============================================================
# Main library: all verified and conjectural modules
# Entry point: AXLE.lean (barrel file at root)
# ============================================================
[[lean_lib]]
name = "AXLE"
roots = ["AXLE"]

# ============================================================
# Standalone verified modules (can be built independently)
# Useful for CI checks on individual pillars
# ============================================================

[[lean_lib]]
name = "Kakeya"
roots = ["finite"]

[[lean_lib]]
name = "GoldbachToy"
roots = ["Dm3GoldbachToy"]

[[lean_lib]]
name = "NSToy"
roots = ["Dm3NSToy"]

[[lean_lib]]
name = "RHToy"
roots = ["Dm3RHToy"]

[[lean_lib]]
name = "MahloHierarchy"
roots = ["AXLE_v5_1"]

[[lean_lib]]
name = "Main"
roots = ["Main_v6"]

[[lean_lib]]
name = "TribonacciRatioConvergence"
roots = ["TribonacciRatioConvergence"]

# ============================================================
# Book 6 — differential equations library (seed).
# Both targets are honest scaffolds (axiom placeholders + tagged
# sorries mirroring each paper's own ledger); neither has been
# built against Mathlib yet. See HeatEquation_Step1.lean and
# HelixToyModel.lean file headers for the per-declaration status.
# ============================================================
[[lean_lib]]
name = "HeatEquationStep1"
roots = ["HeatEquation_Step1"]

[[lean_lib]]
name = "HelixToyModel"
roots = ["HelixToyModel"]
