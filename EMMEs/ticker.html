<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMMEs · Live Ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --void: #04040a;
  --surface: #0d0d1a;
  --card: #0e0e18;
  --border: #ffffff0f;
  --accent1: #ff3cac;
  --accent2: #00f5d4;
  --accent3: #f7c948;
  --text: #e8e8f0;
  --muted: #555570;
  --green: #00e676;
  --red: #ff3860;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--void);
  color: var(--text);
  min-height: 100vh;
}

/* ── NAV ── */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.2rem 2rem;
  border-bottom: 1px solid var(--border);
}
nav a {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  color: var(--muted);
  text-decoration: none;
  text-transform: uppercase;
}
nav a:hover { color: var(--text); }
nav a.active { color: var(--text); }
.nav-right { display: flex; gap: 2rem; }

/* ── PAGE HEADER ── */
.page-header {
  padding: 4rem 2rem 3rem;
  max-width: 1000px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1.5rem;
}
.page-header h1 {
  font-family: 'Space Mono', monospace;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
}
.page-header h1 span { color: var(--accent2); }
.refresh-info {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.live-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  animation: blink 1.5s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes blink {
  0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--green); }
  50%       { opacity: 0.25; box-shadow: none; }
}
#countdown { color: var(--text); }

/* ── TICKER TABLE ── */
.ticker-wrap {
  padding: 0 2rem 6rem;
  max-width: 1000px;
  margin: 0 auto;
}

/* full-width token blocks */
.token-block {
  border: 1px solid var(--border);
  margin-bottom: 1.5rem;
  background: var(--card);
  transition: border-color 0.25s;
}
.token-block.c1 { --tok: var(--accent1); }
.token-block.c2 { --tok: var(--accent2); }
.token-block.c3 { --tok: var(--accent3); }
.token-block:hover { border-color: color-mix(in srgb, var(--tok) 40%, transparent); }

.token-block-top {
  border-top: 2px solid var(--tok);
  padding: 2rem 2rem 1.5rem;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1.5rem;
}
.token-id { flex: 1; min-width: 180px; }
.token-ticker-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--tok);
  margin-bottom: 0.3rem;
}
.token-name-label {
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1;
}

.price-block { text-align: right; }
.price-usd {
  font-family: 'Space Mono', monospace;
  font-size: 2rem;
  font-weight: 700;
  color: var(--tok);
  letter-spacing: -0.02em;
  line-height: 1;
}
.price-change {
  font-family: 'Space Mono', monospace;
  font-size: 0.85rem;
  font-weight: 700;
  margin-top: 0.4rem;
  letter-spacing: 0.05em;
}
.price-change.pos { color: var(--green); }
.price-change.neg { color: var(--red); }
.price-change.flat { color: var(--muted); }

.token-stats {
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}
.stat-cell {
  padding: 1.25rem 2rem;
  border-right: 1px solid var(--border);
}
.stat-cell:last-child { border-right: none; }
.stat-cell-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.4rem;
}
.stat-cell-value {
  font-family: 'Space Mono', monospace;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text);
}
.stat-cell-value.loading { color: var(--muted); animation: fade 1.2s ease-in-out infinite; }
@keyframes fade { 0%,100%{opacity:1} 50%{opacity:0.3} }

.token-actions {
  border-top: 1px solid var(--border);
  padding: 1.25rem 2rem;
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  align-items: center;
}
.action-btn {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 0.6rem 1.2rem;
  border: 1px solid;
  transition: all 0.2s;
  white-space: nowrap;
}
.action-btn.primary { color: var(--void); background: var(--tok); border-color: var(--tok); }
.action-btn.primary:hover { opacity: 0.85; }
.action-btn.ghost { color: var(--tok); border-color: color-mix(in srgb, var(--tok) 30%, transparent); }
.action-btn.ghost:hover { background: color-mix(in srgb, var(--tok) 10%, transparent); }
.action-btn.dim { color: var(--muted); border-color: var(--border); }
.action-btn.dim:hover { color: var(--text); border-color: #ffffff22; }
.contract-display {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  color: var(--muted);
  letter-spacing: 0.05em;
  margin-left: auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 280px;
}
@media (max-width: 600px) { .contract-display { display: none; } }

/* ── ERROR / NO DATA STATE ── */
.no-data {
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  color: var(--muted);
  padding: 0.5rem 0;
}

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  padding: 2rem;
  text-align: center;
}
footer p { font-family: 'Space Mono', monospace; font-size: 0.62rem; letter-spacing: 0.1em; color: var(--muted); }
footer a { color: var(--text); text-decoration: none; }
footer a:hover { text-decoration: underline; }

/* ── LAST UPDATED ── */
.last-updated {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  color: var(--muted);
  text-align: center;
  padding: 1rem 2rem 3rem;
}
#last-updated-time { color: var(--text); }
</style>
</head>
<body>
<nav>
  <a href="index.html">← EMMEs</a>
  <div class="nav-right">
    <a href="game-theory.html">THEORY</a>
    <a href="probability.html">PROBABY</a>
    <a href="propaganda.html">PROPAGAN</a>
    <a href="ticker.html" class="active">TICKER</a>
    <a href="theory.html">PAPERS</a>
  </div>
</nav>

<div class="page-header">
  <h1>Live <span>Ticker</span></h1>
  <div class="refresh-info">
    <span class="live-dot"></span>
    Live · refreshes in <span id="countdown">30</span>s
  </div>
</div>

<div class="ticker-wrap" id="ticker-wrap">
  <!-- Blocks rendered by JS -->
</div>

<div class="last-updated">
  Last updated: <span id="last-updated-time">—</span>
</div>

<footer>
  <p>
    <a href="index.html">EMMEs</a> ·
    <a href="https://x.com/myemmecoin" target="_blank">@myemmecoin</a> ·
    <a href="https://t.me/+WC_698vgYxVmZGQx" target="_blank">Telegram</a> ·
    Data via <a href="https://dexscreener.com" target="_blank">Dexscreener</a>
  </p>
  <p style="margin-top:0.6rem">Not financial advice. Prices update every 30 seconds.</p>
</footer>

<script>
const TOKENS = [
  {
    name: 'GAME THEORY',
    ticker: 'THEORY',
    address: '7xtJR6qfexz5ZAsTny77F2H7S7pgmpggiAn7tcnkcoin',
    cls: 'c3',
    coinbook: 'https://coinbook.fun/token/7xtJR6qfexz5ZAsTny77F2H7S7pgmpggiAn7tcnkcoin',
    solscan: 'https://solscan.io/token/7xtJR6qfexz5ZAsTny77F2H7S7pgmpggiAn7tcnkcoin',
    dex: 'https://dexscreener.com/solana/7xtJR6qfexz5ZAsTny77F2H7S7pgmpggiAn7tcnkcoin',
    page: 'game-theory.html'
  },
  {
    name: 'PROBABILITY',
    ticker: 'PROBABY',
    address: '7DgYPRJywzJRtY4rQZRhwNXECdiQ7gmyHQqA48ojcoin',
    cls: 'c2',
    coinbook: 'https://coinbook.fun/token/7DgYPRJywzJRtY4rQZRhwNXECdiQ7gmyHQqA48ojcoin',
    solscan: 'https://solscan.io/token/7DgYPRJywzJRtY4rQZRhwNXECdiQ7gmyHQqA48ojcoin',
    dex: 'https://dexscreener.com/solana/7DgYPRJywzJRtY4rQZRhwNXECdiQ7gmyHQqA48ojcoin',
    page: 'probability.html'
  },
  {
    name: 'PROPAGANDA!',
    ticker: 'PROPAGAN',
    address: '67xb3dpRRGBwngBCvBDxvaPXJMJfJgAQuNK4E7Focoin',
    cls: 'c1',
    coinbook: 'https://coinbook.fun/token/67xb3dpRRGBwngBCvBDxvaPXJMJfJgAQuNK4E7Focoin',
    solscan: 'https://solscan.io/token/67xb3dpRRGBwngBCvBDxvaPXJMJfJgAQuNK4E7Focoin',
    dex: 'https://dexscreener.com/solana/67xb3dpRRGBwngBCvBDxvaPXJMJfJgAQuNK4E7Focoin',
    page: 'propaganda.html'
  }
];

function fmt(n, digits = 2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  if (n < 0.000001) return n.toExponential(2);
  if (n < 0.01) return n.toPrecision(4);
  if (n < 1000) return n.toFixed(digits);
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
  return n.toFixed(digits);
}

function fmtPrice(p) {
  if (p === null || p === undefined || isNaN(p)) return '—';
  const n = parseFloat(p);
  if (n < 0.000001) return '$' + n.toExponential(3);
  if (n < 0.001) return '$' + n.toPrecision(4);
  if (n < 1) return '$' + n.toFixed(6);
  return '$' + n.toFixed(4);
}

function changeCls(v) {
  if (v === null || v === undefined) return 'flat';
  return v > 0 ? 'pos' : v < 0 ? 'neg' : 'flat';
}

function changeStr(v) {
  if (v === null || v === undefined || isNaN(v)) return '— %';
  const sign = v > 0 ? '+' : '';
  return sign + v.toFixed(2) + '% 24h';
}

function shortAddr(addr) {
  return addr.slice(0, 6) + '...' + addr.slice(-6);
}

// Build initial skeleton blocks
function buildSkeleton() {
  const wrap = document.getElementById('ticker-wrap');
  wrap.innerHTML = '';
  TOKENS.forEach(tok => {
    const el = document.createElement('div');
    el.className = `token-block ${tok.cls}`;
    el.id = `block-${tok.ticker}`;
    el.innerHTML = `
      <div class="token-block-top">
        <div class="token-id">
          <div class="token-ticker-label">${tok.ticker} · Solana</div>
          <div class="token-name-label">${tok.name}</div>
        </div>
        <div class="price-block">
          <div class="price-usd" id="price-${tok.ticker}">…</div>
          <div class="price-change flat" id="change-${tok.ticker}">loading</div>
        </div>
      </div>
      <div class="token-stats">
        <div class="stat-cell">
          <div class="stat-cell-label">Market Cap</div>
          <div class="stat-cell-value loading" id="mcap-${tok.ticker}">…</div>
        </div>
        <div class="stat-cell">
          <div class="stat-cell-label">FDV</div>
          <div class="stat-cell-value loading" id="fdv-${tok.ticker}">…</div>
        </div>
        <div class="stat-cell">
          <div class="stat-cell-label">Volume 24h</div>
          <div class="stat-cell-value loading" id="vol-${tok.ticker}">…</div>
        </div>
        <div class="stat-cell">
          <div class="stat-cell-label">Liquidity</div>
          <div class="stat-cell-value loading" id="liq-${tok.ticker}">…</div>
        </div>
        <div class="stat-cell">
          <div class="stat-cell-label">Price (SOL)</div>
          <div class="stat-cell-value loading" id="pricesol-${tok.ticker}">…</div>
        </div>
        <div class="stat-cell">
          <div class="stat-cell-label">Txns 24h</div>
          <div class="stat-cell-value loading" id="txns-${tok.ticker}">…</div>
        </div>
      </div>
      <div class="token-actions">
        <a href="${tok.coinbook}" target="_blank" class="action-btn primary">Buy on Coinbook ↗</a>
        <a href="${tok.dex}" target="_blank" class="action-btn ghost">Dexscreener ↗</a>
        <a href="${tok.page}" class="action-btn dim">Token page</a>
        <a href="${tok.solscan}" target="_blank" class="action-btn dim">Solscan ↗</a>
        <span class="contract-display">${shortAddr(tok.address)}</span>
      </div>
    `;
    wrap.appendChild(el);
  });
}

// Fetch and populate data
async function fetchAll() {
  try {
    const addresses = TOKENS.map(t => t.address).join(',');
    const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${addresses}`);
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    const pairs = data.pairs || [];

    TOKENS.forEach(tok => {
      // Find best pair for this token (highest liquidity)
      const tokenPairs = pairs.filter(p =>
        p.baseToken && p.baseToken.address &&
        p.baseToken.address.toLowerCase() === tok.address.toLowerCase()
      );
      const pair = tokenPairs.sort((a, b) =>
        (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0)
      )[0];

      if (!pair) {
        // No pair found — show dashes
        ['price', 'change', 'mcap', 'fdv', 'vol', 'liq', 'pricesol', 'txns'].forEach(id => {
          const el = document.getElementById(`${id}-${tok.ticker}`);
          if (el) { el.textContent = '—'; el.classList.remove('loading'); }
        });
        return;
      }

      const priceUsd = parseFloat(pair.priceUsd) || null;
      const priceNative = parseFloat(pair.priceNative) || null;
      const change24 = pair.priceChange?.h24 ?? null;
      const vol24 = pair.volume?.h24 ?? null;
      const mcap = pair.marketCap ?? null;
      const fdv = pair.fdv ?? null;
      const liq = pair.liquidity?.usd ?? null;
      const txns = pair.txns?.h24 ? (pair.txns.h24.buys + pair.txns.h24.sells) : null;

      const setEl = (id, val) => {
        const el = document.getElementById(`${id}-${tok.ticker}`);
        if (el) { el.textContent = val; el.classList.remove('loading'); }
      };
      const setElClass = (id, cls) => {
        const el = document.getElementById(`${id}-${tok.ticker}`);
        if (el) { el.className = 'price-change ' + cls; }
      };

      setEl('price', fmtPrice(priceUsd));
      setEl('change', changeStr(change24));
      setElClass('change', changeCls(change24));
      setEl('mcap', mcap ? '$' + fmt(mcap) : '—');
      setEl('fdv',  fdv  ? '$' + fmt(fdv)  : '—');
      setEl('vol',  vol24 ? '$' + fmt(vol24) : '—');
      setEl('liq',  liq  ? '$' + fmt(liq)  : '—');
      setEl('pricesol', priceNative ? fmt(priceNative, 10) + ' SOL' : '—');
      setEl('txns', txns !== null ? txns.toLocaleString() : '—');
    });

    document.getElementById('last-updated-time').textContent = new Date().toLocaleTimeString();
  } catch(e) {
    console.error('Ticker fetch error:', e);
    TOKENS.forEach(tok => {
      const el = document.getElementById(`price-${tok.ticker}`);
      if (el) el.textContent = 'err';
    });
  }
}

// Countdown + auto-refresh
let secs = 30;
function tick() {
  secs--;
  document.getElementById('countdown').textContent = secs;
  if (secs <= 0) {
    secs = 30;
    fetchAll();
  }
}

buildSkeleton();
fetchAll();
setInterval(tick, 1000);
</script>
</body>
</html>
