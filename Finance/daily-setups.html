<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Daily Strategy • CapitalGuard Trader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fas fa-shield-alt text-emerald-600 text-2xl"></i>
        <span class="font-bold text-2xl tracking-tight">CapitalGuard</span>
      </div>
      <div class="flex gap-8 text-sm font-medium">
        <a href="index.html" class="hover:text-emerald-600">Home</a>
        <a href="strategy.html" class="hover:text-emerald-600">Strategy</a>
        <a href="daily-setups.html" class="text-emerald-600">Daily Strategy</a>
        <a href="simulator.html" class="hover:text-emerald-600">Growth Simulator</a>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="max-w-6xl mx-auto px-6 py-12" id="content">
    <!-- Section Title -->
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-5xl font-bold" id="page-title">Dynamic Daily Strategy</h1>
        <p class="text-xl text-gray-600">Focused trade ideas updated dynamically for your strategy.</p>
      </div>
      <div class="text-right">
        <p class="text-sm text-gray-500">Today is</p>
        <p class="text-2xl font-semibold text-emerald-600" id="current-date"></p>
      </div>
    </div>

    <!-- Strategy Container -->
    <div id="strategy-container">
      <!-- Dynamic content will appear here -->
      <p class="text-gray-600 text-center text-xl">Loading today's strategy...</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Display current date
      const dateElement = document.getElementById('current-date');
      const today = new Date();
      dateElement.textContent = today.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      // Fetch dynamic data (adjust API URL for your backend service)
      const strategyContainer = document.getElementById('strategy-container');
      try {
        const response = await fetch('https://your-backend-api.com/api/daily-strategy');
        const data = await response.json();
        
        // Update the strategy HTML dynamically
        strategyContainer.innerHTML = `
          <div class="bg-white rounded-3xl shadow-sm p-10 mb-12 border border-emerald-100">
            <div class="flex items-center gap-4 mb-6">
              <span class="px-4 py-2 bg-emerald-100 text-emerald-700 font-bold rounded-xl">Asset</span>
              <h2 class="text-4xl font-bold">${data.asset}</h2>
            </div>

            <div class="grid md:grid-cols-2 gap-10">
              <div>
                <h3 class="font-semibold text-lg mb-4 text-gray-700">Current Strategy</h3>
                <div class="space-y-6">
                  <div>
                    <p class="text-sm text-gray-500">Current Price</p>
                    <p class="text-3xl font-bold">$${data.currentPrice}</p>
                  </div>
                  <div>
                    <p class="text-sm text-gray-500">Buy Zone</p>
                    <p class="text-2xl font-semibold">$${data.buyZoneLow} - $${data.buyZoneHigh}</p>
                  </div>
                  <div>
                    <p class="text-sm text-gray-500">Stop Loss</p>
                    <p class="text-2xl font-semibold text-red-600">$${data.stopLoss}</p>
                  </div>
                </div>
              </div>
              <div>
                <h3 class="font-semibold text-lg mb-4 text-gray-700">Profit Targets</h3>
                <div class="space-y-6">
                  <div>
                    <p class="font-semibold">+1.0%</p>
                    <p class="text-gray-600">Target 1: $${data.target1}</p>
                  </div>
                  <div>
                    <p class="font-semibold">+2.5%</p>
                    <p class="text-gray-600">Target 2: $${data.target2}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      } catch (error) {
        strategyContainer.innerHTML = `
          <p class="text-red-500 text-center">Failed to load today's strategy. Check your network connection.</p>
        `;
      }
    });
  </script>
</body>
</html>
